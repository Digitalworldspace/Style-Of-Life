<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Style Of Life — Admin</title><link rel="stylesheet" href="/css/style.css"><style>.admin{max-width:1180px;margin:auto;padding:40px 20px}.panel{background:#fff;border:1px solid #e7e4de;border-radius:20px;padding:24px;margin:18px 0;box-shadow:0 12px 35px rgba(0,0,0,.04)}body{background:#faf9f6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid .full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}input,textarea,select{width:100%;padding:12px;border:1px solid #d9d5cd;border-radius:10px;background:#fff;font:inherit}textarea{min-height:120px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:999px;padding:12px 18px;cursor:pointer;font-weight:700;background:#111;color:#fff}button.secondary{background:#eee;color:#111}.status{padding:12px;border-radius:10px;background:#f1f0ed;margin-top:12px}.items{display:grid;gap:10px}.item{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:14px;border:1px solid #e8e5df;border-radius:12px;background:#fff}.item img{width:64px;height:64px;object-fit:cover;border-radius:8px}.item-main{display:flex;gap:12px;align-items:center;min-width:0}.muted{color:#6e6a63;font-size:13px}@media(max-width:720px){.grid{grid-template-columns:1fr}.grid .full{grid-column:auto}}</style></head><body><header class="site-header"><a class="brand" href="/index.html">STYLE OF LIFE</a><nav><a href="/jewelry.html">Store</a><a href="/index.html">Home</a></nav></header><main class="admin"><section class="page-hero"><p class="eyebrow">PRIVATE STORE CONTROL</p><h1>Products, Etsy & your collection.</h1><p>One dashboard for Etsy-synced listings and manual products.</p></section><div class="panel"><h2>Admin access</h2><div class="grid"><div><label>Admin key</label><input id="key" type="password" placeholder="Enter ADMIN_KEY"></div></div><div class="actions"><button onclick="connectEtsy()">Connect Etsy</button><button class="secondary" onclick="syncEtsy()">Sync Etsy Listings</button><button class="secondary" onclick="loadProducts()">Refresh Products</button></div><div id="status" class="status">Enter your admin key to begin.</div></div><div class="panel"><h2>Add manual product</h2><form id="productForm"><div class="grid"><div><label>Product name</label><input name="name" required></div><div><label>Price (USD)</label><input name="price" type="number" min="0" step="0.01" required></div><div><label>Category</label><input name="category" value="Jewelry"></div><div><label>Currency</label><input name="currency" value="USD"></div><div class="full"><label>Description</label><textarea name="description"></textarea></div><div class="full"><label>Images</label><input name="images" type="file" accept="image/*" multiple></div><div><label>Etsy URL (optional)</label><input name="etsy_url" type="url"></div><div><label>Published</label><select name="published"><option value="true">Yes</option><option value="false">No</option></select></div></div><div class="actions"><button type="submit">Add Product</button></div></form></div><div class="panel"><h2>Current products</h2><div id="products" class="items"></div></div></main><script>const $=id=>document.getElementById(id);const headers=()=>({'x-admin-key':$('key').value});function msg(t){$('status').textContent=t}async function connectEtsy(){location.href='/api/etsy/connect?admin_key='+encodeURIComponent($('key').value)}async function syncEtsy(){msg('Syncing Etsy…');const r=await fetch('/api/etsy/sync',{method:'POST',headers:headers()});const j=await r.json().catch(()=>({}));msg(j.message||j.error||'Done');loadProducts()}async function loadProducts(){const r=await fetch('/api/products');const ps=await r.json();$('products').innerHTML=ps.map(p=>`<div class="item"><div class="item-main"><img src="${p.images?.[0]||'/favicon.ico'}"><div><b>${p.name||p.title}</b><div class="muted">${p.source||'manual'} · $${Number(p.price||0).toFixed(2)}</div></div></div><button class="secondary" onclick="del('${p.id}')">Delete</button></div>`).join('')||'<div class="muted">No products.</div>'}async function del(id){if(!confirm('Delete this product?'))return;const r=await fetch('/api/products/'+encodeURIComponent(id),{method:'DELETE',headers:headers()});msg(r.ok?'Deleted':'Delete failed');loadProducts()}$('productForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.target;const fd=new FormData(f);const files=f.images.files;fd.delete('images');for(const file of files)fd.append('images',file);const r=await fetch('/api/products',{method:'POST',headers:headers(),body:fd});const j=await r.json().catch(()=>({}));msg(j.error||'Product added');if(r.ok)f.reset();loadProducts()});loadProducts();</script></body></html>
